<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultrasound ROI Cropper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --border:    #30363d;
      --accent:    #2f81f7;
      --accent-dk: #1a6bd4;
      --success:   #3fb950;
      --warn:      #d29922;
      --error:     #f85149;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --radius:    10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }
    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    header p {
      color: var(--muted);
      margin-top: 6px;
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      width: 100%;
      max-width: 760px;
      margin-bottom: 24px;
    }

    /* ── Drop zone ── */
    #dropzone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }
    #dropzone:hover, #dropzone.drag-over {
      border-color: var(--accent);
      background: rgba(47, 129, 247, 0.06);
    }
    #dropzone svg { color: var(--muted); margin-bottom: 12px; }
    #dropzone .dz-label {
      font-size: 1rem;
      color: var(--text);
      margin-bottom: 4px;
    }
    #dropzone .dz-sub {
      font-size: 0.82rem;
      color: var(--muted);
    }
    #dropzone .dz-sub span {
      color: var(--accent);
      cursor: pointer;
    }
    #file-input { display: none; }

    /* ── Selected file pill ── */
    #file-info {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      padding: 10px 14px;
      background: rgba(47,129,247,0.08);
      border: 1px solid rgba(47,129,247,0.25);
      border-radius: 6px;
      font-size: 0.88rem;
    }
    #file-info .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #file-info .fsize { color: var(--muted); white-space: nowrap; }
    #file-info button {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 1rem; padding: 0 4px;
    }
    #file-info button:hover { color: var(--error); }

    /* ── Submit button ── */
    #submit-btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    #submit-btn:hover:not(:disabled) { background: var(--accent-dk); }
    #submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Progress section ── */
    #progress-section { display: none; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .progress-label .stage { color: var(--text); }
    .progress-bar-track {
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.4s ease;
      width: 0%;
    }

    /* ── Result section ── */
    #result-section { display: none; }

    .result-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .badge-success { background: rgba(63,185,80,0.12); color: var(--success); border: 1px solid rgba(63,185,80,0.3); }
    .badge-warn    { background: rgba(210,153,34,0.12); color: var(--warn);    border: 1px solid rgba(210,153,34,0.3); }

    video#output-player {
      width: 100%;
      border-radius: 6px;
      background: #000;
      display: block;
      max-height: 480px;
      object-fit: contain;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }
    .meta-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
    }
    .meta-item .key {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .meta-item .val {
      font-size: 0.95rem;
      font-weight: 600;
      font-family: "SF Mono", "Fira Code", Consolas, monospace;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .btn {
      flex: 1;
      padding: 11px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary   { background: var(--accent);  color: #fff; }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }

    /* ── Error banner ── */
    #error-banner {
      display: none;
      padding: 14px 16px;
      background: rgba(248,81,73,0.1);
      border: 1px solid rgba(248,81,73,0.3);
      border-radius: 6px;
      color: var(--error);
      font-size: 0.9rem;
      margin-top: 16px;
    }

    /* ── New job button ── */
    #new-job-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 16px;
      width: 100%;
      transition: color 0.15s, border-color 0.15s;
    }
    #new-job-btn:hover { color: var(--text); border-color: var(--text); }

    .conf-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 4px;
    }
  </style>
</head>
<body>

<header>
  <h1>Ultrasound ROI Cropper</h1>
  <p>Upload a raw ultrasound machine UI recording — get back only the scan area.</p>
</header>

<!-- Upload card -->
<div class="card" id="upload-card">
  <div id="dropzone">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="none"
         viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.3">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
    </svg>
    <p class="dz-label">Drag &amp; drop a video file here</p>
    <p class="dz-sub">or <span id="browse-link">browse to choose</span></p>
    <p class="dz-sub" style="margin-top:8px">MP4 · AVI · MOV · MKV</p>
    <input type="file" id="file-input" accept="video/mp4,video/avi,video/quicktime,video/x-matroska,.mp4,.avi,.mov,.mkv,.MP4,.AVI,.MOV,.MKV" />
  </div>

  <div id="file-info">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
         viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M15.75 10.5l4.72-4.72a.75.75 0 011.28.53v11.38a.75.75 0 01-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 002.25-2.25v-9a2.25 2.25 0 00-2.25-2.25h-9A2.25 2.25 0 002.25 7.5v9A2.25 2.25 0 004.5 18.75z"/>
    </svg>
    <span class="fname" id="fname-text"></span>
    <span class="fsize" id="fsize-text"></span>
    <button id="clear-btn" title="Remove">✕</button>
  </div>

  <div id="error-banner"></div>

  <button id="submit-btn" disabled>Process Video</button>
</div>

<!-- Progress card -->
<div class="card" id="progress-section">
  <div class="progress-label">
    <span class="stage" id="stage-text">Starting…</span>
    <span id="pct-text">0%</span>
  </div>
  <div class="progress-bar-track">
    <div class="progress-bar-fill" id="progress-fill"></div>
  </div>
</div>

<!-- Result card -->
<div class="card" id="result-section">
  <div class="result-header">
    <span style="font-size:1.1rem;font-weight:700">Result</span>
    <span class="badge badge-success" id="conf-badge">✓ High confidence</span>
  </div>

  <video id="output-player" controls playsinline preload="metadata"></video>

  <div class="meta-grid">
    <div class="meta-item">
      <div class="key">ROI coordinates</div>
      <div class="val" id="meta-roi">—</div>
    </div>
    <div class="meta-item">
      <div class="key">Crop size</div>
      <div class="val" id="meta-size">—</div>
    </div>
    <div class="meta-item">
      <div class="key">Detection method</div>
      <div class="val" id="meta-method">—</div>
    </div>
    <div class="meta-item">
      <div class="key">Confidence</div>
      <div class="val" id="meta-conf">—</div>
    </div>
  </div>

  <div class="actions">
    <a class="btn btn-primary" id="download-btn" href="#" download>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none"
           viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/>
      </svg>
      Download cropped video
    </a>
    <button class="btn btn-secondary" id="new-job-inline">Process another video</button>
  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let selectedFile = null;
  let pollTimer    = null;
  let currentJobId = null;

  // ── DOM refs ───────────────────────────────────────────────────────────────
  const dropzone      = document.getElementById("dropzone");
  const fileInput     = document.getElementById("file-input");
  const browseLink    = document.getElementById("browse-link");
  const fileInfo      = document.getElementById("file-info");
  const fnameText     = document.getElementById("fname-text");
  const fsizeText     = document.getElementById("fsize-text");
  const clearBtn      = document.getElementById("clear-btn");
  const submitBtn     = document.getElementById("submit-btn");
  const errorBanner   = document.getElementById("error-banner");
  const uploadCard    = document.getElementById("upload-card");

  const progressSec   = document.getElementById("progress-section");
  const stageText     = document.getElementById("stage-text");
  const pctText       = document.getElementById("pct-text");
  const progressFill  = document.getElementById("progress-fill");

  const resultSec     = document.getElementById("result-section");
  const outputPlayer  = document.getElementById("output-player");
  const confBadge     = document.getElementById("conf-badge");
  const metaRoi       = document.getElementById("meta-roi");
  const metaSize      = document.getElementById("meta-size");
  const metaMethod    = document.getElementById("meta-method");
  const metaConf      = document.getElementById("meta-conf");
  const downloadBtn   = document.getElementById("download-btn");
  const newJobInline  = document.getElementById("new-job-inline");

  // ── Helpers ────────────────────────────────────────────────────────────────
  function fmtBytes(b) {
    if (b < 1024)       return b + " B";
    if (b < 1048576)    return (b/1024).toFixed(1) + " KB";
    return (b/1048576).toFixed(1) + " MB";
  }

  function showError(msg) {
    errorBanner.textContent = msg;
    errorBanner.style.display = "block";
  }

  function clearError() {
    errorBanner.style.display = "none";
    errorBanner.textContent   = "";
  }

  function setFile(file) {
    selectedFile = file;
    fnameText.textContent = file.name;
    fsizeText.textContent = fmtBytes(file.size);
    fileInfo.style.display  = "flex";
    submitBtn.disabled      = false;
    clearError();
  }

  function clearFile() {
    selectedFile            = null;
    fileInput.value         = "";
    fileInfo.style.display  = "none";
    submitBtn.disabled      = true;
    clearError();
  }

  function setProgress(pct, stage) {
    progressFill.style.width = pct + "%";
    pctText.textContent      = pct + "%";
    if (stage) stageText.textContent = stage;
  }

  function resetToUpload() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    currentJobId = null;
    clearFile();
    uploadCard.style.display    = "block";
    progressSec.style.display   = "none";
    resultSec.style.display     = "none";
    outputPlayer.src            = "";
    setProgress(0, "Starting…");
  }

  // ── Drag & drop ────────────────────────────────────────────────────────────
  dropzone.addEventListener("dragover", e => {
    e.preventDefault();
    dropzone.classList.add("drag-over");
  });
  dropzone.addEventListener("dragleave", () => dropzone.classList.remove("drag-over"));
  dropzone.addEventListener("drop", e => {
    e.preventDefault();
    dropzone.classList.remove("drag-over");
    const file = e.dataTransfer.files[0];
    if (file) setFile(file);
  });
  dropzone.addEventListener("click", () => fileInput.click());
  browseLink.addEventListener("click", e => { e.stopPropagation(); fileInput.click(); });
  fileInput.addEventListener("change", () => {
    if (fileInput.files[0]) setFile(fileInput.files[0]);
  });
  clearBtn.addEventListener("click", e => { e.stopPropagation(); clearFile(); });

  // ── Submit ─────────────────────────────────────────────────────────────────
  submitBtn.addEventListener("click", async () => {
    if (!selectedFile) return;
    clearError();

    const fd = new FormData();
    fd.append("video", selectedFile);

    submitBtn.disabled = true;
    uploadCard.style.display  = "block";
    progressSec.style.display = "block";
    setProgress(0, "Uploading…");

    let resp, data;
    try {
      resp = await fetch("/upload", { method: "POST", body: fd });
      data = await resp.json();
    } catch (err) {
      showError("Upload failed: " + err.message);
      submitBtn.disabled = false;
      progressSec.style.display = "none";
      return;
    }

    if (!resp.ok || data.error) {
      showError(data.error || "Upload error");
      submitBtn.disabled = false;
      progressSec.style.display = "none";
      return;
    }

    currentJobId = data.job_id;
    uploadCard.style.display = "none";
    startPolling(currentJobId);
  });

  // ── Polling ────────────────────────────────────────────────────────────────
  function startPolling(jobId) {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(() => poll(jobId), 1200);
  }

  async function poll(jobId) {
    let resp, job;
    try {
      resp = await fetch(`/status/${jobId}`);
      job  = await resp.json();
    } catch (e) {
      return;
    }

    setProgress(job.progress || 0, job.stage || "Processing…");

    if (job.status === "done") {
      clearInterval(pollTimer);
      pollTimer = null;
      showResult(jobId, job);
    } else if (job.status === "error") {
      clearInterval(pollTimer);
      pollTimer = null;
      progressSec.style.display = "none";
      uploadCard.style.display  = "block";
      showError("Processing failed: " + (job.error || "unknown error"));
      submitBtn.disabled = false;
    }
  }

  // ── Show result ────────────────────────────────────────────────────────────
  function showResult(jobId, job) {
    progressSec.style.display = "none";
    resultSec.style.display   = "block";

    // Video player
    outputPlayer.src = `/stream/${jobId}`;
    outputPlayer.load();

    // Download link
    downloadBtn.href = `/download/${jobId}`;
    downloadBtn.setAttribute("download", job.output_filename || "roi_crop.mp4");

    // Metadata
    if (job.roi) {
      const [x1,y1,x2,y2] = job.roi;
      metaRoi.textContent  = `(${x1}, ${y1}) → (${x2}, ${y2})`;
      metaSize.textContent = `${x2-x1} × ${y2-y1} px`;
    }
    metaMethod.textContent = job.method || "—";

    const conf = job.confidence || 0;
    metaConf.textContent = (conf * 100).toFixed(0) + "%";

    const dotColor = conf >= 0.90 ? "#3fb950" : conf >= 0.70 ? "#d29922" : "#f85149";
    confBadge.innerHTML =
      `<span class="conf-dot" style="background:${dotColor}"></span>` +
      (conf >= 0.90 ? "High confidence" : conf >= 0.70 ? "Moderate confidence" : "Low confidence — review recommended");
    confBadge.className = "badge " + (conf >= 0.90 ? "badge-success" : "badge-warn");
  }

  // ── New job ────────────────────────────────────────────────────────────────
  newJobInline.addEventListener("click", resetToUpload);
</script>
</body>
</html>
