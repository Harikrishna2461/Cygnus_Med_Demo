<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f172a; --surface: #1e293b; --border: #334155;
      --text: #e2e8f0; --muted: #94a3b8; --dim: #64748b;
      --blue: #2563eb; --blue-dk: #1d4ed8;
      --green: #16a34a; --green-bg: #dcfce7;
      --red: #dc2626; --red-bg: #fee2e2;
      --amber: #d97706; --amber-bg: #fef3c7;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; min-height: 100vh; }
    .topnav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 52px; display: flex; align-items: center; gap: 16px; }
    .topnav a { color: var(--muted); text-decoration: none; font-size: 13px; transition: color 0.15s; }
    .topnav a:hover { color: var(--text); }
    .topnav h1 { font-size: 15px; font-weight: 700; }
    .spacer { flex: 1; }
    .logout-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all 0.15s; }
    .logout-btn:hover { border-color: #475569; color: var(--text); }
    .export-btn { background: var(--green); border: none; color: #fff; padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .export-btn:hover:not(:disabled) { background: #15803d; }
    .export-btn:disabled { background: var(--border); color: var(--dim); cursor: not-allowed; }
    .page { max-width: 860px; margin: 32px auto; padding: 0 20px; }
    .section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 28px; overflow: hidden; }
    .section-header { padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .section-header h2 { font-size: 14px; font-weight: 700; }
    .section-body { padding: 20px; }
    .field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
    .field input { width: 100%; padding: 9px 12px; border-radius: 7px; border: 1.5px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px; font-family: inherit; outline: none; transition: border-color 0.15s; }
    .field input:focus { border-color: var(--blue); }
    .field input::placeholder { color: #475569; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
    .checkbox-row input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--blue); cursor: pointer; }
    .checkbox-row label { font-size: 13px; color: var(--text); cursor: pointer; }
    .form-actions { margin-top: 16px; display: flex; align-items: center; gap: 10px; }
    .btn { padding: 9px 18px; border-radius: 7px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--blue-dk); }
    .btn-primary:disabled { background: var(--border); color: var(--dim); cursor: not-allowed; }
    .toast { font-size: 13px; padding: 7px 12px; border-radius: 6px; display: none; }
    .toast.success { background: var(--green-bg); color: var(--green); display: inline-block; }
    .toast.error { background: var(--red-bg); color: var(--red); display: inline-block; }
    .users-table { width: 100%; border-collapse: collapse; }
    .users-table th { text-align: left; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
    .users-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
    .users-table tr:last-child td { border-bottom: none; }
    .users-table tr:hover td { background: rgba(255,255,255,0.03); }
    .badge { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px; }
    .badge-admin { background: var(--amber-bg); color: var(--amber); }
    .badge-user { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
    .badge-inactive { background: var(--red-bg); color: var(--red); }
    .act-btn { background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: 5px; font-size: 12px; font-weight: 600; transition: all 0.15s; }
    .act-btn.deactivate { color: var(--red); }
    .act-btn.deactivate:hover { background: var(--red-bg); }
    .empty-state { text-align: center; color: var(--dim); padding: 40px; font-size: 13px; }
  </style>
</head>
<body>

<div class="topnav">
  <a href="/">&#8592; Home</a>
  <h1>Admin Panel</h1>
  <div class="spacer"></div>
  <button class="export-btn" id="export-btn" onclick="downloadDB(this)">Download DB</button>
  <button class="logout-btn" onclick="logout()">Log out</button>
</div>

<div class="page">
  <div class="section">
    <div class="section-header"><h2>Add New User</h2></div>
    <div class="section-body">
      <div class="field" style="max-width:320px">
        <label for="new-username">Username</label>
        <input id="new-username" type="text" placeholder="e.g. dr.smith" autocomplete="off" />
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="new-is-admin" />
        <label for="new-is-admin">Grant admin privileges</label>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="add-btn" onclick="addUser()">Add User</button>
        <span id="add-toast" class="toast"></span>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-header"><h2>Users</h2></div>
    <div id="users-container" style="padding:0"><div class="empty-state">Loading...</div></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  loadUsers();
  document.getElementById('new-username').addEventListener('keydown', e => { if (e.key === 'Enter') addUser(); });
});

async function api(path, method = 'GET', body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' }, credentials: 'include' };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  return { ok: r.ok, data };
}

async function loadUsers() {
  const { ok, data } = await api('/api/admin/users');
  const c = document.getElementById('users-container');
  if (!ok || !Array.isArray(data)) { c.innerHTML = '<div class="empty-state">Failed to load users.</div>'; return; }
  if (!data.length) { c.innerHTML = '<div class="empty-state">No users yet.</div>'; return; }
  const rows = data.map(u => {
    const role = u.is_admin ? '<span class="badge badge-admin">Admin</span>' : '<span class="badge badge-user">User</span>';
    const status = u.is_active ? '' : ' <span class="badge badge-inactive">Inactive</span>';
    const actions = u.is_active ? `<button class="act-btn deactivate" onclick="deactivate('${u.user_id}','${esc(u.username)}')">Deactivate</button>` : '';
    return `<tr><td><strong>${esc(u.username)}</strong></td><td>${role}${status}</td><td style="color:var(--dim);font-size:12px">${fmtDate(u.created_at)}</td><td>${actions}</td></tr>`;
  }).join('');
  c.innerHTML = `<table class="users-table"><thead><tr><th>Username</th><th>Role</th><th>Created</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function addUser() {
  const username = document.getElementById('new-username').value.trim();
  const isAdmin = document.getElementById('new-is-admin').checked;
  const btn = document.getElementById('add-btn');
  const toast = document.getElementById('add-toast');
  if (!username) { showToast(toast, 'Username is required.', 'error'); return; }
  btn.disabled = true; btn.textContent = 'Adding...';
  const { ok, data } = await api('/api/admin/users', 'POST', { username, is_admin: isAdmin });
  btn.disabled = false; btn.textContent = 'Add User';
  if (ok) {
    showToast(toast, `User "${username}" added.`, 'success');
    document.getElementById('new-username').value = '';
    document.getElementById('new-is-admin').checked = false;
    loadUsers();
  } else {
    showToast(toast, data.error || 'Failed to create user.', 'error');
  }
}

async function deactivate(userId, username) {
  if (!confirm(`Deactivate "${username}"? They will not be able to log in.`)) return;
  const { ok } = await api(`/api/admin/users/${userId}`, 'DELETE');
  if (ok) loadUsers();
}

async function logout() {
  await fetch('/api/logout', { method: 'POST', credentials: 'include' });
  window.location.href = '/login';
}

function showToast(el, msg, type) {
  el.textContent = msg; el.className = `toast ${type}`;
  setTimeout(() => { el.className = 'toast'; }, 3500);
}
async function downloadDB(btn) {
  btn.disabled = true; btn.textContent = 'Exporting...';
  try {
    const r = await fetch('/api/admin/export-db', { credentials: 'include' });
    if (!r.ok) { alert('Export failed.'); return; }
    const blob = await r.blob();
    const cd = r.headers.get('Content-Disposition') || '';
    const match = cd.match(/filename="([^"]+)"/);
    const filename = match ? match[1] : 'cmed_db_export.json';
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  } catch { alert('Export failed.'); }
  finally { btn.disabled = false; btn.textContent = 'Download DB'; }
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(iso) { try { return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); } catch { return iso||''; } }
</script>
</body>
</html>
