<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medical Knowledge Chat</title>
  <style>
    /* ── Reset & base ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue-700: #1d4ed8;
      --blue-600: #2563eb;
      --blue-100: #dbeafe;
      --slate-900: #0f172a;
      --slate-700: #334155;
      --slate-500: #64748b;
      --slate-400: #94a3b8;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --slate-50:  #f8fafc;
      --white:     #ffffff;
      --green-600: #16a34a;
      --amber-600: #d97706;
      --red-600:   #dc2626;
      --sidebar-w: 260px;
      --hdr-h:     56px;
    }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--slate-50); color: var(--slate-900); font-size: 14px; }

    /* ── Layout ─────────────────────────────────────────────────────────── */
    #app { display: flex; height: 100vh; overflow: hidden; }

    /* ── Sidebar ────────────────────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w); flex-shrink: 0;
      display: flex; flex-direction: column;
      background: var(--slate-900); color: var(--white);
      overflow: hidden;
    }
    #sidebar-header {
      padding: 16px; border-bottom: 1px solid rgba(255,255,255,.1);
      flex-shrink: 0;
    }
    #sidebar-header .app-name {
      font-size: 15px; font-weight: 700; letter-spacing: .3px;
      color: var(--white);
    }
    #sidebar-header .app-sub {
      font-size: 11px; color: var(--slate-400); margin-top: 2px;
    }
    #new-session-btn {
      margin-top: 12px; width: 100%;
      padding: 9px 12px; border-radius: 7px;
      border: 1px solid rgba(255,255,255,.2);
      background: transparent; color: var(--white);
      font-size: 13px; cursor: pointer; text-align: left;
      display: flex; align-items: center; gap: 8px; transition: background .15s;
    }
    #new-session-btn:hover { background: rgba(255,255,255,.08); }
    #new-session-btn .icon { font-size: 16px; }

    #session-list { flex: 1; overflow-y: auto; padding: 8px; }
    .session-item {
      padding: 9px 10px; border-radius: 7px; cursor: pointer;
      margin-bottom: 2px; transition: background .15s;
      display: flex; align-items: center; gap: 4px;
    }
    .session-item:hover { background: rgba(255,255,255,.07); }
    .session-item.active { background: rgba(255,255,255,.14); }
    .s-item-info { flex: 1; min-width: 0; }
    .session-item .s-title {
      font-size: 12.5px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--white);
    }
    .session-item .s-date {
      font-size: 11px; color: var(--slate-400); margin-top: 2px;
    }
    .s-delete-btn {
      flex-shrink: 0; background: none; border: none;
      color: var(--slate-500); font-size: 15px; line-height: 1;
      cursor: pointer; padding: 2px 6px; border-radius: 4px;
      opacity: 0; transition: opacity .15s, background .15s, color .15s;
    }
    .session-item:hover .s-delete-btn { opacity: 1; }
    .s-delete-btn:hover { color: var(--white); background: rgba(220,38,38,.5); }

    #sidebar-footer { padding: 10px; border-top: 1px solid rgba(255,255,255,.1); flex-shrink: 0; }
    #status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--slate-500); display: inline-block; margin-right: 6px; }
    #status-dot.ok { background: var(--green-600); }
    #status-dot.warn { background: var(--amber-600); }
    #status-dot.err { background: var(--red-600); }

    /* ── Main content ───────────────────────────────────────────────────── */
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* ── Chat header ────────────────────────────────────────────────────── */
    #chat-header {
      height: var(--hdr-h); flex-shrink: 0;
      border-bottom: 1px solid var(--slate-200);
      display: flex; align-items: center; padding: 0 20px; gap: 12px;
      background: var(--white);
    }
    #session-title { font-size: 14.5px; font-weight: 600; color: var(--slate-900); }
    #status-badge {
      margin-left: auto; font-size: 11.5px; padding: 3px 10px;
      border-radius: 20px; background: var(--slate-100); color: var(--slate-500);
      display: flex; align-items: center; gap: 5px;
    }

    /* ── Messages ───────────────────────────────────────────────────────── */
    #messages-wrap { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

    .msg-row { display: flex; gap: 10px; }
    .msg-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700;
    }
    .avatar.user { background: var(--blue-600); color: var(--white); }
    .avatar.bot  { background: var(--slate-200); color: var(--slate-700); }

    .msg-bubble {
      max-width: 78%; background: var(--white);
      border: 1px solid var(--slate-200); border-radius: 12px;
      padding: 12px 14px; font-size: 13.5px; line-height: 1.55;
    }
    .msg-row.user .msg-bubble {
      background: var(--blue-600); color: var(--white);
      border-color: var(--blue-600);
    }
    .msg-bubble.error { border-color: var(--red-600); background: #fee2e2; color: var(--red-600); }
    .msg-bubble.warning { border-color: var(--amber-600); background: #fef3c7; color: #92400e; }
    .msg-bubble.thinking { color: var(--slate-400); font-style: italic; }

    .msg-text { white-space: pre-wrap; word-wrap: break-word; }

    /* ── Empty state ────────────────────────────────────────────────────── */
    .empty-state { text-align: center; color: var(--slate-400); padding: 60px 20px; font-size: 14px; }
    .empty-state .icon { font-size: 40px; margin-bottom: 10px; }

    /* ── Input area ─────────────────────────────────────────────────────── */
    #input-area {
      padding: 14px 20px; border-top: 1px solid var(--slate-200);
      background: var(--white); flex-shrink: 0;
    }
    #input-row { display: flex; gap: 8px; align-items: flex-end; }
    #msg-input {
      flex: 1; padding: 10px 14px; border-radius: 10px;
      border: 1.5px solid var(--slate-200); font-size: 13.5px;
      font-family: inherit; resize: none; outline: none;
      background: var(--slate-50); color: var(--slate-900);
      line-height: 1.5; max-height: 140px; overflow-y: auto;
      transition: border-color .15s;
    }
    #msg-input:focus { border-color: var(--blue-600); background: var(--white); }
    #msg-input::placeholder { color: var(--slate-400); }
    #send-btn {
      padding: 10px 18px; border-radius: 10px;
      background: var(--blue-600); color: var(--white);
      border: none; font-size: 13.5px; font-weight: 600;
      cursor: pointer; transition: background .15s; white-space: nowrap;
    }
    #send-btn:hover:not(:disabled) { background: var(--blue-700); }
    #send-btn:disabled { background: var(--slate-400); cursor: not-allowed; }
    .input-hint { font-size: 11px; color: var(--slate-400); margin-top: 6px; }

    .back-to-home {
      text-decoration: none !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <div id="sidebar">
      <div id="sidebar-header">
        <div class="app-name">Medical Assistant</div>
        <div class="app-sub">General Chat</div>
      </div>
      <button id="new-session-btn" onclick="newSession()">
        <span>+ New Chat</span>
      </button>
      <div id="session-list"></div>
      <div id="sidebar-footer">
        <div style="font-size: 11px; color: var(--slate-400);">
          <span id="status-dot"></span>
          <span id="status-text">Checking…</span>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div id="main">
      <!-- Header -->
      <div id="chat-header">
        <span id="session-title">Select a chat or start a new one</span>
        <span id="status-badge">Checking status…</span>
      </div>

      <!-- Messages -->
      <div id="messages-wrap">
        <div class="empty-state">
          <div>Ask any medical or surgical question.<br>
          The assistant will search the medical knowledge base and provide an evidence-based answer.</div>
        </div>
      </div>

      <!-- Input -->
      <div id="input-area">
        <div id="input-row">
          <textarea id="msg-input" rows="2"
            placeholder="e.g. What is Doppler ultrasound used for? Or: Explain venous insufficiency..."
          ></textarea>
          <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
        <div class="input-hint">Press Enter to send · Shift+Enter for new line</div>
      </div>
    </div>
  </div>

  <script>
    // ── State ──────────────────────────────────────────────────────────────────
    let currentSessionId = null;
    let isLoading = false;
    const chatMode = 'general';

    // ── Init ───────────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      setupInputHandlers();
      await checkStatus();
      await loadSessions();
      const sessions = await api('/api/sessions?mode=general');
      const deleted = getDeletedSessions();
      const visible = (sessions || []).filter(s => !deleted.has(s.session_id));
      if (visible.length > 0) {
        await loadSession(visible[0].session_id, visible[0].title);
      }
      setInterval(checkStatus, 30000);
    });

    // ── API helper ─────────────────────────────────────────────────────────────
    async function api(path, method = 'GET', body = null) {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (body) opts.body = JSON.stringify(body);
      try {
        const r = await fetch(path, opts);
        const data = await r.json();
        if (!r.ok) console.error(`API error (${r.status}):`, data);
        return data;
      } catch (e) {
        console.error('API error:', e);
        return null;
      }
    }

    // ── Status ─────────────────────────────────────────────────────────────────
    async function checkStatus() {
      const s = await api('/api/status');
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      const badge = document.getElementById('status-badge');

      if (!s) {
        dot.className = 'err';
        text.textContent = 'Offline';
        badge.textContent = 'Server offline';
        return;
      }

      const generalReady = s.qdrant?.document_count > 0;
      if (generalReady) {
        dot.className = 'ok';
        text.textContent = 'Ready';
        badge.textContent = `Ready · ${s.qdrant.document_count} docs`;
      } else {
        dot.className = 'warn';
        text.textContent = 'Checking…';
        badge.textContent = 'Knowledge base loading';
      }
    }

    // ── Sessions ───────────────────────────────────────────────────────────────
    function getDeletedSessions() {
      try { return new Set(JSON.parse(localStorage.getItem('cmed_deleted_sessions') || '[]')); }
      catch { return new Set(); }
    }

    async function hideSession(sid) {
      // Instant UI feedback via localStorage
      const deleted = getDeletedSessions();
      deleted.add(sid);
      localStorage.setItem('cmed_deleted_sessions', JSON.stringify([...deleted]));
      if (currentSessionId === sid) {
        currentSessionId = null;
        document.getElementById('session-title').textContent = 'Select a chat or start a new one';
        document.getElementById('messages-wrap').innerHTML = `
          <div class="empty-state">
            <div>Ask any medical or surgical question.<br>
            The assistant will search the medical knowledge base and provide an evidence-based answer.</div>
          </div>`;
      }
      loadSessions();
      // Persist on backend (data is kept, only marked hidden)
      await api(`/api/session/${sid}/hide`, 'PATCH');
    }

    async function loadSessions() {
      const sessions = await api('/api/sessions?mode=general');
      const deleted = getDeletedSessions();
      const visible = (sessions || []).filter(s => !deleted.has(s.session_id));
      const list = document.getElementById('session-list');
      list.innerHTML = '';
      if (visible.length === 0) {
        list.innerHTML = '<div style="padding:10px 12px;font-size:12px;color:#64748b">No chats yet</div>';
        return;
      }
      visible.forEach(s => {
        const el = document.createElement('div');
        el.className = 'session-item' + (s.session_id === currentSessionId ? ' active' : '');
        el.dataset.id = s.session_id;
        el.innerHTML = `
          <div class="s-item-info">
            <div class="s-title">${escHtml(s.title)}</div>
            <div class="s-date">${formatDate(s.updated_at)}</div>
          </div>
          <button class="s-delete-btn" title="Remove from list">&#x2715;</button>`;
        el.onclick = () => loadSession(s.session_id, s.title);
        el.querySelector('.s-delete-btn').onclick = (e) => { e.stopPropagation(); hideSession(s.session_id); };
        list.appendChild(el);
      });
    }

    async function newSession() {
      const s = await api('/api/session', 'POST', { title: 'New Chat', mode: 'general' });
      if (!s) return;
      currentSessionId = s.session_id;
      document.getElementById('session-title').textContent = s.title;
      document.getElementById('messages-wrap').innerHTML = `
        <div class="empty-state">
          <div>Ask any medical or surgical question from the knowledge base.</div>
        </div>`;
      await loadSessions();
    }

    async function loadSession(sid, title) {
      currentSessionId = sid;
      const titleEl = document.getElementById('session-title');
      titleEl.textContent = title || 'Chat';

      const header = document.getElementById('chat-header');
      if (!header.querySelector('.back-to-home')) {
        const backBtn = document.createElement('a');
        backBtn.className = 'back-to-home';
        backBtn.href = '/';
        backBtn.style.cssText = 'margin-right:auto;padding:6px 12px;border-radius:6px;background:var(--slate-100);color:var(--slate-600);text-decoration:none;font-size:12px;cursor:pointer;transition:all .15s;';
        backBtn.textContent = '← Back to Home';
        backBtn.onmouseover = (e) => e.target.style.background = 'var(--slate-200)';
        backBtn.onmouseout = (e) => e.target.style.background = 'var(--slate-100)';
        header.insertBefore(backBtn, header.firstChild);
      }

      const msgs = await api(`/api/session/${sid}/messages`);
      const wrap = document.getElementById('messages-wrap');
      wrap.innerHTML = '';
      if (!msgs || msgs.length === 0) {
        wrap.innerHTML = `<div class="empty-state"><div>Start a conversation about medical topics.</div></div>`;
      } else {
        msgs.forEach(m => renderMessage(m.role, m.content, m.metadata));
        wrap.scrollTop = wrap.scrollHeight;
      }
      await loadSessions();
    }

    // ── Chat ───────────────────────────────────────────────────────────────────
    function setupInputHandlers() {
      const input = document.getElementById('msg-input');
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (!isLoading) sendMessage();
        }
      });
      input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 140) + 'px';
      });
    }

    async function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text || isLoading) return;

      if (!currentSessionId) await newSession();

      input.value = '';
      input.style.height = 'auto';

      const wrap = document.getElementById('messages-wrap');
      const emptyState = wrap.querySelector('.empty-state');
      if (emptyState) emptyState.remove();

      appendBubble('user', text, null);

      const thinkId = 'think-' + Date.now();
      wrap.innerHTML += `<div class="msg-row" id="${thinkId}">
        <div class="avatar bot">AI</div>
        <div class="msg-bubble thinking">Searching knowledge base…</div>
      </div>`;
      wrap.scrollTop = wrap.scrollHeight;

      setLoading(true);
      const data = await api('/api/general-chat', 'POST', {
        session_id: currentSessionId,
        message: text,
        mode: 'general',
      });
      setLoading(false);

      document.getElementById(thinkId)?.remove();

      if (!data) {
        appendBubble('bot', 'Network error — please try again.', null, 'error');
        return;
      }

      if (data.type === 'general' || data.type === 'conversational') {
        appendBubble('bot', data.conversational_response, null);
      } else if (data.type === 'guardrail') {
        appendBubble('bot', data.conversational_response, null, 'warning');
      } else if (data.type === 'error') {
        appendBubble('bot', data.conversational_response || 'Error', null, 'error');
      }

      await loadSessions();
      wrap.scrollTop = wrap.scrollHeight;
    }

    function setLoading(v) {
      isLoading = v;
      document.getElementById('send-btn').disabled = v;
      document.getElementById('msg-input').disabled = v;
    }

    // ── Render helpers ─────────────────────────────────────────────────────────
    function appendBubble(role, text, _metadata, extraClass = '') {
      const wrap = document.getElementById('messages-wrap');
      const row = document.createElement('div');
      row.className = 'msg-row' + (role === 'user' ? ' user' : '');
      row.innerHTML = `
        <div class="avatar ${role}">${role === 'user' ? 'You' : 'AI'}</div>
        <div class="msg-bubble ${extraClass}"><div class="msg-text">${escHtml(text)}</div></div>`;
      wrap.appendChild(row);
    }

    function renderMessage(role, content, metadata) {
      appendBubble(role, content, metadata);
    }

    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function formatDate(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      const now = new Date();
      const diffMin = Math.floor((now - d) / 60000);
      if (diffMin < 60) return diffMin + 'm ago';
      const diffHour = Math.floor(diffMin / 60);
      if (diffHour < 24) return diffHour + 'h ago';
      const diffDay = Math.floor(diffHour / 24);
      if (diffDay < 7) return diffDay + 'd ago';
      return d.toLocaleDateString();
    }
  </script>
</body>
</html>
