<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Medical Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 20px;
      color: #e2e8f0;
    }
    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 14px;
      padding: 40px 36px; width: 100%; max-width: 400px;
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo h1 { font-size: 1.5em; font-weight: 700; color: #ffffff; margin-bottom: 4px; }
    .logo p { font-size: 0.82em; color: #64748b; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 10px 14px; border-radius: 8px;
      border: 1.5px solid #334155; background: #0f172a;
      color: #e2e8f0; font-size: 14px; font-family: inherit; outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #2563eb; }
    input::placeholder { color: #475569; }
    .error-msg {
      background: #450a0a; border: 1px solid #dc2626; color: #fca5a5;
      border-radius: 7px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px;
      display: none;
    }
    .error-msg.show { display: block; }
    .btn-login {
      width: 100%; padding: 11px; border-radius: 8px; border: none;
      background: #2563eb; color: #ffffff; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background 0.2s; margin-top: 4px;
    }
    .btn-login:hover:not(:disabled) { background: #1d4ed8; }
    .btn-login:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    .footer-note { text-align: center; margin-top: 22px; font-size: 12px; color: #475569; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>Medical Assistant</h1>
    <p>CHIVA Clinical &amp; General Knowledge Platform</p>
  </div>
  <div id="error-msg" class="error-msg"></div>
  <div class="field">
    <label for="username">Username</label>
    <input id="username" type="text" placeholder="Enter your username" autocomplete="username" />
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" />
  </div>
  <button id="login-btn" class="btn-login" onclick="doLogin()">Sign In</button>
  <div class="footer-note">Contact your administrator to get access.</div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('username').focus();
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('username').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('password').focus();
  });
});

async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('error-msg');

  errEl.className = 'error-msg';

  if (!username || !password) {
    showError('Please enter your username and password.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Signing in...';

  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ username, password }),
    });
    const data = await r.json();
    if (r.ok) {
      window.location.href = '/';
    } else {
      showError(data.error || 'Login failed. Please try again.');
    }
  } catch (e) {
    showError('Network error. Please try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.className = 'error-msg show';
}
</script>
</body>
</html>
